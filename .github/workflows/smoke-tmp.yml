name: smoke-tmp (temporary, removed before merge)
on:
  push:
    branches: [feat/native-freebsd-runner]
    paths: ['.github/workflows/smoke-tmp.yml', '.github/smoke-tmp/**']
permissions:
  contents: read
  actions: read
jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image: [freebsd-14-14.5, freebsd-15-15.1]
        fw: [bios, uefi]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.image }}
          path: art
          run-id: 44897734699
          github-token: ${{ github.token }}
      - name: Install QEMU
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf genisoimage socat
          sudo chmod 0666 /dev/kvm
      - name: Verify checksum
        working-directory: art
        run: sha256sum -c *.qcow2.sha256
      - name: Boot and check
        env:
          W: ${{ runner.temp }}
        run: |
          img=$(ls $PWD/art/*.qcow2)
          .github/smoke-tmp/smoke.sh "$img" ${{ matrix.fw }} t | tee result.txt
          grep -q "ssh: OK" result.txt && grep -q "qga info: {\"return\"" result.txt
      - name: Console log
        if: always()
        run: tail -60 ${{ runner.temp }}/console-t.log || true
